<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Molecular Simulation on Quantum Computing Systems. CSE 402: Numerical Analysis, Simulation and Modeling.">
  <title>Molecular Simulation on Quantum Computing Systems</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070714"/>
      <stop offset="0.55" stop-color="#15153e"/>
      <stop offset="1" stop-color="#2b2b6e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.20" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#6a5acd" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6a5acd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bcaef7"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#9d8df1"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#glow)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- travelling top shimmer -->
  <rect x="0" y="0" width="1200" height="2.5" fill="#5eead4" opacity="0.3"/>
  <rect x="-240" y="0" width="240" height="2.5" fill="#ffffff" opacity="0.55">
    <animate attributeName="x" values="-240;1200" dur="4.2s" repeatCount="indefinite"/>
  </rect>

  <!-- twinkling particles -->
  <g fill="#bcaef7">
    <circle cx="70" cy="54" r="1.7"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="70" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="4.1s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="1075" cy="150" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.7s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="330" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="4.6s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="34" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="58" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.9s" begin="0.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- quantum circuit motif -->
  <g stroke="#9d8df1" stroke-width="2" fill="none" opacity="0.3">
    <line x1="720" y1="300" x2="1150" y2="300"/>
    <line x1="720" y1="338" x2="1150" y2="338"/>
    <rect x="792" y="286" width="28" height="28" rx="5"/>
    <rect x="884" y="324" width="28" height="28" rx="5"/>
    <rect x="1006" y="286" width="28" height="28" rx="5"/>
    <line x1="1020" y1="300" x2="1020" y2="338"/>
    <circle cx="1020" cy="338" r="4" fill="#9d8df1"/>
  </g>
  <circle r="3.6" fill="#5eead4" filter="url(#soft)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M720,300 H1150"/>
  </circle>
  <circle r="3.2" fill="#c084fc" filter="url(#soft)">
    <animateMotion dur="3.6s" begin="0.6s" repeatCount="indefinite" path="M720,338 H1150"/>
  </circle>

  <!-- molecule -->
  <g transform="translate(232 190)">
    <g fill="none" stroke="#5eead4" stroke-width="1.3" opacity="0.28">
      <ellipse rx="70" ry="45"/>
      <ellipse rx="70" ry="45" transform="rotate(60)"/>
      <ellipse rx="70" ry="45" transform="rotate(120)"/>
    </g>

    <circle r="26" fill="none" stroke="#bcaef7" stroke-width="2">
      <animate attributeName="r" values="24;48;24" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0;0.55" dur="3.8s" repeatCount="indefinite"/>
    </circle>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/>
      <g stroke="#8a7fe8" stroke-width="5" stroke-linecap="round" opacity="0.85">
        <line x1="0" y1="0" x2="-104" y2="-60"/>
        <line x1="0" y1="0" x2="112" y2="-32"/>
        <line x1="0" y1="0" x2="-22" y2="112"/>
      </g>
      <circle cx="-104" cy="-60" r="17" fill="#5eead4"/>
      <circle cx="112" cy="-32" r="14" fill="#c084fc"/>
      <circle cx="-22" cy="112" r="12" fill="#8a7fe8"/>
    </g>

    <circle r="25" fill="#bcaef7" filter="url(#soft)">
      <animate attributeName="r" values="23;28;23" dur="3.8s" repeatCount="indefinite"/>
    </circle>

    <circle r="4.5" fill="#5eead4">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M70,0 A70,45 0 1,1 -70,0 A70,45 0 1,1 70,0"/>
    </circle>
    <g transform="rotate(60)">
      <circle r="4" fill="#c084fc">
        <animateMotion dur="3.5s" repeatCount="indefinite" path="M70,0 A70,45 0 1,1 -70,0 A70,45 0 1,1 70,0"/>
      </circle>
    </g>
    <g transform="rotate(120)">
      <circle r="4" fill="#bcaef7">
        <animateMotion dur="4.1s" repeatCount="indefinite" path="M70,0 A70,45 0 1,1 -70,0 A70,45 0 1,1 70,0"/>
      </circle>
    </g>
  </g>

  <!-- expectation-value watermark -->
  <text x="232" y="352" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#9d8df1" opacity="0.4">&#10216;&#968;|H|&#968;&#10217;</text>

  <!-- title block -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="446" y="150" font-size="41" font-weight="800" fill="url(#ink)">Molecular Simulation</text>
    <text x="446" y="199" font-size="41" font-weight="800" fill="url(#ink)">on Quantum Computing Systems</text>
    <text x="448" y="243" font-size="18.5" font-style="italic" font-weight="500" fill="#b3a6f5">CSE 402 : Numerical Analysis, Simulation and Modeling</text>
    <rect x="448" y="257" height="3" rx="1.5" fill="url(#wire)" width="470">
      <animate attributeName="width" from="0" to="470" dur="1.1s" begin="0.3s" fill="freeze"/>
    </rect>
  </g>
</svg>
